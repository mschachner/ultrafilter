name: Build and deploy

on:
  schedule:
    # Every six hours, at :17 past (off-the-hour times get less contention
    # on GitHub's shared scheduler, so runs start closer to on time).
    - cron: "17 */6 * * *"
    # Once more shortly after the album task's 9:04 UTC firing, so the day's
    # picks are on the page by breakfast.
    - cron: "45 9 * * *"
  workflow_dispatch: # lets you trigger a refresh by hand from the Actions tab
  push:
    branches: [main] # any push redeploys the site with fresh data

# Deploys are serialized; a run already in flight finishes rather than being
# cancelled, so a deploy is never half-done.
concurrency:
  group: pages-deploy
  cancel-in-progress: false

# The job never commits — it builds the site and hands it to Pages directly,
# so `main` only ever contains human commits.
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build section data
        run: node scripts/build.mjs
        env:
          # Fine-grained PAT, read-only Contents on the private albums repo.
          # Without it the albums section quietly stays pending.
          SPOTIFY_RECS_TOKEN: ${{ secrets.SPOTIFY_RECS_TOKEN }}

      # Only what the site actually serves goes into the artifact —
      # no node_modules, scripts, or repo housekeeping.
      - name: Assemble the site
        run: |
          mkdir _site
          cp index.html _site/
          cp -r data _site/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
