<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Keeps this page out of search results. Note: it does NOT make the page
     private — anyone with the URL can still read it. Do not add a robots.txt
     "Disallow" rule for this path: that would stop crawlers from fetching the
     page, which means they'd never see this noindex tag and could still list
     the bare URL if they found a link to it. -->
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<title>Ultrafilter</title>
<style>
  :root {
    --bg: #F5F6F2;
    --ink: #20262B;
    --muted: #6B7278;
    --faint: #9AA1A6;
    --line: #DBDED6;
    --hover: #EBEDE6;
    --display: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    --body: Seravek, "Gill Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
    --mono: "SF Mono", Menlo, Consolas, monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { font-size: 16px; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--body);
    line-height: 1.5;
    padding: 2.5rem 1.25rem 5rem;
  }
  .wrap { max-width: 46rem; margin: 0 auto; }

  header { border-bottom: 3px double var(--ink); padding-bottom: 1rem; }
  .mast-row { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: .5rem; }
  h1 { font-family: var(--display); font-weight: 400; font-size: 2.35rem; letter-spacing: .01em; }
  .mast-tools { display: flex; align-items: center; gap: .75rem; font-size: .8rem; color: var(--muted); }

  button {
    font-family: var(--body); font-size: .8rem; color: var(--ink);
    background: none; border: 1px solid var(--line); border-radius: 999px;
    padding: .3rem .85rem; cursor: pointer;
  }
  button:hover { background: var(--hover); }
  button:focus-visible, a:focus-visible { outline: 2px solid #4756A8; outline-offset: 2px; }
  button[disabled] { opacity: .5; cursor: default; }

  .chips { display: flex; flex-wrap: wrap; gap: .5rem; margin: 1.25rem 0 0; }
  .chip { display: inline-flex; align-items: center; gap: .45rem; border: 1px solid var(--line);
          border-radius: 999px; background: none; padding: .35rem .9rem; font-size: .85rem; }
  .chip .dot { width: .55rem; height: .55rem; border-radius: 50%; background: var(--dot, var(--faint)); }
  .chip .n { color: var(--muted); font-family: var(--mono); font-size: .7rem; }
  .chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }
  .chip[aria-pressed="true"] .n { color: #cfd4d8; }

  #ledger { display: none; margin-top: 1.25rem; border: 1px solid var(--line); border-radius: .5rem;
            padding: 1rem 1.25rem; font-size: .82rem; }
  #ledger.open { display: block; }
  #ledger h2 { font-family: var(--display); font-weight: 400; font-size: 1.05rem; margin-bottom: .5rem; }
  .ledger-row { display: flex; justify-content: space-between; gap: 1rem; padding: .3rem 0; border-top: 1px dotted var(--line); }
  .ledger-row a { color: var(--ink); }
  .ledger-status { font-family: var(--mono); font-size: .7rem; text-align: right; max-width: 20rem; word-break: break-word; }
  .ok { color: #557A33; }
  .fail { color: #A33B2E; }

  .dateline { font-family: var(--mono); font-size: .75rem; letter-spacing: .04em;
              color: var(--muted); margin: 2.25rem 0 .5rem; display: flex; align-items: center; gap: .75rem; }
  .dateline::after { content: ""; flex: 1; border-top: 1px solid var(--line); }
  .post { display: flex; gap: .75rem; padding: .55rem .5rem; border-radius: .4rem; align-items: baseline; }
  .post:hover { background: var(--hover); }
  .post .dot { flex: none; width: .55rem; height: .55rem; border-radius: 50%; background: var(--dot, var(--faint)); position: relative; top: -.05rem; }
  .post-main { min-width: 0; }
  .post-title { font-family: var(--display); font-size: 1.05rem; color: var(--ink); text-decoration: none; }
  .post-title:hover { text-decoration: underline; text-underline-offset: 3px; }
  .post-title:visited { color: var(--muted); }
  .post-src { font-size: .78rem; color: var(--muted); margin-left: .6rem; white-space: nowrap; }

  #status-line { margin-top: 2rem; color: var(--muted); font-size: .9rem; }

  @media (prefers-reduced-motion: no-preference) { .post { transition: background .12s ease; } }
  @media (max-width: 480px) {
    .post { flex-wrap: wrap; }
    .post-src { margin-left: 1.3rem; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="mast-row">
      <h1>Ultrafilter</h1>
      <div class="mast-tools">
        <span id="report">Loading&hellip;</span>
        <button id="toggle-ledger" aria-expanded="false">Feeds</button>
        <button id="reload">Reload</button>
      </div>
    </div>
  </header>

  <div class="chips" id="chips" role="group" aria-label="Filter by topic"></div>

  <section id="ledger" aria-label="Feed status"></section>

  <main id="list" aria-live="polite"></main>
  <p id="status-line">Loading posts&hellip;</p>

</div>

<script>
const DATA_URL = "./data/posts.json";

let data = null;
let activeTopic = "all";
let lastChecked = null; // set on manual Reload only

const $ = sel => document.querySelector(sel);

function esc(s) {
  const d = document.createElement("div");
  d.textContent = s == null ? "" : s;
  return d.innerHTML;
}

function topicColor(id) {
  const t = (data?.topics || []).find(t => t.id === id);
  return t ? t.color : "#9AA1A6";
}

function visibleCount(topicId) {
  const posts = data?.posts || [];
  return topicId === "all" ? posts.length : posts.filter(p => p.topics.includes(topicId)).length;
}

function renderChips() {
  const chips = data?.topics || [];
  $("#chips").innerHTML = chips.map(c => `
    <button class="chip" data-topic="${esc(c.id)}" aria-pressed="${activeTopic === c.id}"
      style="--dot:${esc(c.color)}">
      <span class="dot" aria-hidden="true"></span>
      ${esc(c.label)} <span class="n">${visibleCount(c.id)}</span>
    </button>`).join("");
  // Clicking the active chip deselects it, returning to the unfiltered view.
  document.querySelectorAll(".chip").forEach(btn =>
    btn.addEventListener("click", () => {
      activeTopic = activeTopic === btn.dataset.topic ? "all" : btn.dataset.topic;
      render();
    }));
}

function renderLedger() {
  const feeds = data?.feeds || [];
  const rows = feeds.map(f => {
    const ok = f.status === "ok";
    const label = ok
      ? `${f.count} posts${f.source && f.source !== "direct" ? ` \u00b7 via ${esc(f.source)}` : ""}`
      : `failed \u2014 ${esc(f.error || "unknown")}`;
    return `<div class="ledger-row">
      <span><a href="${esc(f.site)}" target="_blank" rel="noopener">${esc(f.name)}</a>
        <span style="color:var(--faint)"> \u2014 ${esc(f.author)}</span></span>
      <span class="ledger-status ${ok ? "ok" : "fail"}">${label}</span>
    </div>`;
  }).join("");
  $("#ledger").innerHTML = `<h2>Feed ledger</h2>${rows}`;
}

function renderList() {
  const posts = (data?.posts || [])
    .filter(p => activeTopic === "all" || p.topics.includes(activeTopic));

  if (!posts.length) { $("#list").innerHTML = ""; return; }

  let html = "", lastKey = null;
  for (const p of posts) {
    const d = p.date ? new Date(p.date) : null;
    const key = d && !isNaN(d) ? dateKey(d) : "Undated";
    if (key !== lastKey) { html += `<h2 class="dateline">${key}</h2>`; lastKey = key; }
    html += `<div class="post" style="--dot:${topicColor(p.topics[0])}">
      <span class="dot" aria-hidden="true"></span>
      <span class="post-main">
        <a class="post-title" href="${esc(p.link)}" target="_blank" rel="noopener">${esc(p.title)}</a>
        <span class="post-src">${esc(p.feed)}</span>
      </span>
    </div>`;
  }
  $("#list").innerHTML = html;
}

// "Monday 27 July", with the year only when it isn't the current one.
function dateKey(d) {
  const weekday = d.toLocaleDateString("en-GB", { weekday: "long" });
  const month = d.toLocaleDateString("en-GB", { month: "long" });
  const year = d.getFullYear();
  const suffix = year === new Date().getFullYear() ? "" : ` ${year}`;
  return `${weekday} ${d.getDate()} ${month}${suffix}`;
}

function renderStatus() {
  const failed = (data?.feeds || []).filter(f => f.status !== "ok").length;
  $("#report").textContent = `${data.feedsOk} of ${data.feedsTotal} feeds` + (failed ? ` (${failed} failed)` : "");
  const when = data.generated ? new Date(data.generated) : null;
  const parts = [`${(data.posts || []).length} posts`, `updated ${when ? relativeTime(when) : "unknown"}`];
  if (lastChecked) parts.push(`checked ${relativeTime(lastChecked)}`);
  $("#status-line").textContent = parts.join(" \u00b7 ") + ".";
}

function relativeTime(then) {
  const mins = Math.round((Date.now() - then.getTime()) / 60000);
  if (mins < 2) return "just now";
  if (mins < 60) return `${mins} minutes ago`;
  const hrs = Math.round(mins / 60);
  if (hrs < 24) return `${hrs} hour${hrs === 1 ? "" : "s"} ago`;
  const days = Math.round(hrs / 24);
  return `${days} day${days === 1 ? "" : "s"} ago`;
}

function render() {
  renderChips();
  renderLedger();
  renderList();
  renderStatus();
}

async function load({ manual = false } = {}) {
  const btn = $("#reload");
  btn.disabled = true;
  if (manual) btn.textContent = "Reloading\u2026";
  const started = Date.now();
  try {
    // Cache-buster so a refreshed build shows up without a hard reload.
    const res = await fetch(`${DATA_URL}?t=${Date.now()}`, { cache: "no-store" });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    data = await res.json();
    if (manual) lastChecked = new Date();
    render();
  } catch (err) {
    $("#status-line").textContent =
      `Couldn't load ${DATA_URL} (${err.message}). If this is a fresh checkout, the scheduled job hasn't run yet \u2014 trigger it from the Actions tab, or run "npm ci && node scripts/build-feeds.mjs" locally.`;
    $("#report").textContent = "no data";
  } finally {
    if (manual) {
      // Hold the in-flight label long enough to register as feedback.
      await new Promise(r => setTimeout(r, Math.max(0, 450 - (Date.now() - started))));
      btn.textContent = "Reload";
    }
    btn.disabled = false;
  }
}

$("#toggle-ledger").addEventListener("click", () => {
  const open = $("#ledger").classList.toggle("open");
  $("#toggle-ledger").setAttribute("aria-expanded", String(open));
});
$("#reload").addEventListener("click", () => load({ manual: true }));

load();
</script>
</body>
</html>
