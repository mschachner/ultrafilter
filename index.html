<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Keeps this page out of search results. Note: it does NOT make the page
     private — anyone with the URL can still read it. Do not add a robots.txt
     "Disallow" rule for this path: that would stop crawlers from fetching the
     page, which means they'd never see this noindex tag and could still list
     the bare URL if they found a link to it. -->
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<title>Ultrafilter</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script>
  // Apply the stored theme before first paint so there is no flash.
  try {
    const t = localStorage.getItem("ultrafilter:theme");
    if (t) document.documentElement.dataset.theme = t;
  } catch {}
</script>
<style>
  /* ------------------------------- themes -------------------------------
     Three light, three dark, each with its own faces. Broadsheet (the
     original cream newspaper) is the default; the palette button in the
     masthead switches, and the choice persists in this browser. */
  :root {                       /* Broadsheet — cream newsprint */
    --bg: #F7F3EB;
    --ink: #20262B;
    --muted: #6B7278;
    --faint: #9AA1A6;
    --line: #E0D9CB;
    --hover: #EFEAE0;
    --accent: #4756A8;
    --ok: #557A33;
    --fail: #A33B2E;
    --display: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    --body: Seravek, "Gill Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
    --mono: "SF Mono", Menlo, Consolas, monospace;
  }
  html[data-theme="preprint"] {  /* Preprint — white paper, LaTeX manners */
    --bg: #FEFEFC;
    --ink: #1B1B1F;
    --muted: #5F6268;
    --faint: #9B9EA4;
    --line: #E5E4DF;
    --hover: #F1F0EB;
    --accent: #3A5BA0;
    --ok: #46783A;
    --fail: #A63B2E;
    --display: Baskerville, "Libre Baskerville", "Times New Roman", Georgia, serif;
    --body: Charter, "Bitstream Charter", "Iowan Old Style", Georgia, serif;
    --mono: "Courier New", Courier, monospace;
  }
  html[data-theme="gallery"] {   /* Gallery — cool white, catalogue sans */
    --bg: #FAFAF7;
    --ink: #26282B;
    --muted: #6F747B;
    --faint: #A2A6AB;
    --line: #E4E3DE;
    --hover: #F0EFEA;
    --accent: #497A8A;
    --ok: #5B8046;
    --fail: #B0503F;
    --display: Optima, Candara, "Gill Sans", "Segoe UI", sans-serif;
    --body: "Avenir Next", Avenir, "Helvetica Neue", Helvetica, sans-serif;
    --mono: "SF Mono", Menlo, Consolas, monospace;
  }
  html[data-theme="slate"] {     /* Slate — the ring palette's blue, after dark */
    --bg: #242B34;
    --ink: #E6E1D5;
    --muted: #9AA2AC;
    --faint: #67707B;
    --line: #3A434F;
    --hover: #2C3541;
    --accent: #98ABDC;
    --ok: #98BC7D;
    --fail: #DB9384;
    --display: "New York", ui-serif, Georgia, serif;
    --body: system-ui, -apple-system, "Helvetica Neue", sans-serif;
    --mono: "SF Mono", Menlo, Consolas, monospace;
  }
  html[data-theme="console"] {   /* Console — near-black, everything mono */
    --bg: #17191B;
    --ink: #D6D3C9;
    --muted: #8E9296;
    --faint: #5C6165;
    --line: #2B2E31;
    --hover: #202326;
    --accent: #93B383;
    --ok: #93B383;
    --fail: #CD8B7C;
    --display: "SF Mono", Menlo, Consolas, monospace;
    --body: "SF Mono", Menlo, Consolas, monospace;
    --mono: "SF Mono", Menlo, Consolas, monospace;
  }
  html[data-theme="nocturne"] {  /* Nocturne — plum-black, an evening face */
    --bg: #221E26;
    --ink: #E9E2D8;
    --muted: #A79DAC;
    --faint: #746B79;
    --line: #37313E;
    --hover: #2B2531;
    --accent: #C39FB4;
    --ok: #9CBB80;
    --fail: #D68D7E;
    --display: "Hoefler Text", "Palatino Linotype", Palatino, Georgia, serif;
    --body: Seravek, "Gill Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
    --mono: Menlo, Consolas, monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { font-size: 16px; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--body);
    line-height: 1.5;
    padding: 2.5rem 2rem 5rem;
  }
  .cols { display: flex; gap: 3rem; align-items: flex-start; }
  .main { flex: 1 1 46rem; min-width: 0; max-width: 46rem; }
  .rail { flex: 1 1 36rem; min-width: 0; }

  header { border-bottom: 3px double var(--ink); padding-bottom: .5rem; }
  .mast-row { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: .75rem 2rem; }
  h1 { font-family: var(--display); font-weight: 400; font-size: 2.35rem; letter-spacing: .01em; line-height: 1.15; }

  button {
    font-family: var(--body); font-size: .8rem; color: var(--ink);
    background: none; border: 1px solid var(--line); border-radius: 999px;
    padding: .3rem .85rem; cursor: pointer;
  }
  button:hover { background: var(--hover); }
  button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ------------------------------ weather ------------------------------ */
  #weather { display: none; align-items: flex-end; flex-wrap: wrap; gap: .5rem 1.5rem; margin-left: auto; }
  #weather.on { display: flex; }
  .wx-now { display: flex; align-items: center; gap: .6rem; }
  .wx-now .ticon { width: 1.4rem; height: 1.4rem; color: var(--muted); }
  .wx-temp { font-family: var(--display); font-size: 1.55rem; line-height: 1; }
  .wx-desc { font-size: .76rem; color: var(--muted); line-height: 1.3; }
  /* Two lines per day — day + icon, then temps — so the type stays readable
     while the strip fits inside the masthead title's height. */
  .wx-days { display: flex; gap: 1.4rem; flex-wrap: wrap; }
  .wx-day { text-align: center; line-height: 1.25; }
  .wx-day .d { font-family: var(--mono); font-size: .66rem; letter-spacing: .05em;
               text-transform: uppercase; color: var(--muted);
               display: flex; align-items: center; justify-content: center; gap: .3rem; }
  .wx-day .ticon { width: .95rem; height: .95rem; color: var(--muted); }
  .wx-day .t { font-family: var(--mono); font-size: .8rem; }
  .wx-day .t .lo { color: var(--faint); }
  .wx-day .p { font-family: var(--mono); font-size: .7rem; color: var(--accent); }

  /* --------------------------- daily sections --------------------------- */
  .klabel { font-family: var(--mono); font-size: .66rem; letter-spacing: .09em;
            text-transform: uppercase; color: var(--muted); }

  #albums-sec, #wiki-sec { display: none; }
  #albums-sec.on, #wiki-sec.on { display: block; }

  /* Each card sits on its category's colour; all type on it runs cream. */
  .albums { display: flex; flex-wrap: wrap; gap: 1.25rem; align-items: stretch; }
  .album { flex: 1 1 10rem; min-width: 10rem; max-width: 22rem;
           background: var(--acc, var(--hover)); color: #F0EBE1;
           border-radius: .5rem; padding: 1rem 1.1rem; }
  .album .klabel { color: rgba(240, 235, 225, .8); }
  .cover-btn { display: block; width: 100%; padding: 0; margin: 0 0 .7rem; border: none;
               border-radius: .35rem; background: none; cursor: zoom-in; }
  .album-cover { display: block; width: 100%; aspect-ratio: 1; object-fit: cover;
                 border-radius: .35rem; }
  @media (prefers-reduced-motion: no-preference) {
    .album-cover { transition: transform .15s ease, box-shadow .15s ease; }
  }
  .cover-btn:hover { background: none; }
  .cover-btn:hover .album-cover, .cover-btn:focus-visible .album-cover {
    transform: scale(1.02); box-shadow: 0 .35rem 1rem rgba(20, 24, 28, .35); }
  .album-head { margin: .35rem 0 .1rem; font-family: var(--display); font-size: 1.05rem; line-height: 1.3; }
  .album-head a { color: #F0EBE1; text-decoration: none; }
  .album-head a:hover { text-decoration: underline; text-underline-offset: 3px; }
  .album-year { color: rgba(240, 235, 225, .75); font-size: .85rem; }
  .album-genres { font-family: var(--mono); font-size: .68rem; color: rgba(240, 235, 225, .85); margin-bottom: .5rem; }
  .album p { font-size: .84rem; line-height: 1.45; }
  .album .reception { margin-top: .5rem; color: rgba(240, 235, 225, .82); }
  .srch { font-family: var(--mono); font-size: .62rem; color: rgba(240, 235, 225, .6); margin-left: .3rem; }
  .crate-link { display: inline-block; margin-top: .9rem; font-family: var(--mono);
                font-size: .72rem; letter-spacing: .05em; text-transform: uppercase;
                color: var(--muted); text-decoration: none; }
  .crate-link:hover { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }

  /* ------------------------- cover lightbox ------------------------- */
  #lightbox { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column;
              align-items: center; justify-content: center; gap: 1rem;
              background: rgba(32, 38, 43, .35);
              -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
  #lightbox[hidden] { display: none; }
  #lightbox .lb-art { width: min(76vmin, 40rem); aspect-ratio: 1; border-radius: .5rem;
                      object-fit: cover; box-shadow: 0 1.5rem 4rem rgba(20, 24, 28, .5); }
  #lightbox figure, #lb-stage { display: contents; }
  #lightbox figcaption { font-family: var(--display); font-size: 1.05rem; color: #F7F3EB;
                         text-shadow: 0 1px 8px rgba(20, 24, 28, .6); text-align: center;
                         padding: 0 1rem; }
  #lb-close { position: fixed; top: 1.1rem; right: 1.25rem; width: 2.6rem; height: 2.6rem;
              border: none; border-radius: 999px; background: rgba(32, 38, 43, .55);
              color: #F0EBE1; font-size: 1.35rem; line-height: 1; cursor: pointer; }
  #lb-close:hover { background: rgba(32, 38, 43, .8); }

  .reroll { border: none; border-radius: .35rem; background: none; padding: .15rem;
            color: var(--muted); line-height: 0; }
  .reroll:hover { color: var(--ink); background: var(--hover); }
  .reroll svg { width: 1.05rem; height: 1.05rem; }
  @media (prefers-reduced-motion: no-preference) {
    .reroll.spin svg { animation: dice-roll .7s linear infinite; }
  }
  @keyframes dice-roll { to { transform: rotate(360deg); } }

  .wiki { display: grid; grid-template-columns: minmax(0, 1fr) 17rem; gap: 2rem; }
  .tfa-title { font-family: var(--display); font-size: 1.35rem; color: var(--ink);
               text-decoration: none; display: inline-block; margin: .3rem 0 .05rem; }
  .tfa-title:hover { text-decoration: underline; text-underline-offset: 3px; }
  .tfa-desc { font-size: .82rem; color: var(--muted); display: block; margin-bottom: .5rem; }
  .tfa-extract { font-size: .88rem; line-height: 1.5; display: -webkit-box;
                 -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden; }
  .wpick { display: flex; gap: .6rem; padding: .45rem 0; border-top: 1px dotted var(--line);
           align-items: baseline; }
  .wpick:first-of-type { margin-top: .45rem; }
  .wpick .ticon { position: relative; top: .15rem; flex: none; }
  .wpick-main { min-width: 0; }
  .wpick-title { font-family: var(--display); font-size: .98rem; color: var(--ink); text-decoration: none; }
  .wpick-title:hover { text-decoration: underline; text-underline-offset: 3px; }
  .wpick-desc { display: block; font-size: .74rem; color: var(--muted);
                white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ------------------------------ blogroll ------------------------------ */
  .chips { display: flex; flex-wrap: wrap; gap: .5rem; margin: 1rem 0 0; }
  .chip { display: inline-flex; align-items: center; gap: .45rem; border: 1px solid var(--line);
          border-radius: 999px; background: none; padding: .35rem .9rem; font-size: .85rem; }
  .chip .n { color: var(--muted); font-family: var(--mono); font-size: .7rem; }
  .chip[aria-pressed="true"] { background: color-mix(in srgb, var(--ink) 10%, var(--bg));
                               border-color: var(--muted); }
  .chip[aria-pressed="true"] .n { color: var(--muted); }

  .ticon { width: .95rem; height: .95rem; flex: none; color: var(--dot, var(--faint)); }

  /* The ledger is the site footer: one line of section statuses, with the
     per-feed detail expanding into columns below it. */
  #ledger { margin-top: 4rem; border-top: 3px double var(--ink); padding-top: .85rem;
            font-size: .82rem; }
  .ledger-sections { display: flex; flex-wrap: wrap; align-items: baseline; gap: .4rem 2.5rem; }
  .lsec { display: inline-flex; align-items: baseline; gap: .6rem; color: var(--ink); }
  button.lsec { font-family: var(--body); font-size: .82rem; border: none; border-radius: 0;
                background: none; padding: 0; cursor: pointer; }
  button.lsec:hover { background: none; text-decoration: underline; text-underline-offset: 3px; }
  .ledger-status { font-family: var(--mono); font-size: .68rem; word-break: break-word; }
  .ok { color: var(--ok); }
  .fail { color: var(--fail); }
  .dim { color: var(--faint); }
  .lcaret { display: inline-block; font-size: .58rem; color: var(--faint);
            margin-right: .4rem; transform: translateY(-.1em); transition: transform .12s ease; }
  .lcaret.open { transform: rotate(90deg); }
  .lfeeds { margin-top: .75rem; padding-top: .35rem; border-top: 1px dotted var(--line);
            column-width: 17rem; column-gap: 2.5rem; }
  .ledger-row { display: flex; justify-content: space-between; flex-wrap: wrap; gap: .15rem .75rem;
                padding: .3rem 0; border-bottom: 1px dotted var(--line); break-inside: avoid;
                font-size: .78rem; }
  .ledger-row a { color: var(--ink); }

  .dateline { font-family: var(--mono); font-size: .75rem; letter-spacing: .04em;
              color: var(--muted); margin: 2.25rem 0 .5rem; display: flex; align-items: center; gap: .75rem; }
  .dateline::after { content: ""; flex: 1; border-top: 1px solid var(--line); }
  .section-head { font-family: var(--display); font-weight: 400; font-size: 1.5rem;
                  letter-spacing: .01em; color: var(--ink); margin: 2.25rem 0 .9rem;
                  display: flex; align-items: baseline; gap: .85rem; }
  .section-head::after { content: ""; flex: 1; border-top: 1px solid var(--line);
                         order: 1; align-self: center; }
  .section-head .sh-date { font-size: .95rem; font-style: italic; color: var(--muted); }
  .section-head .dl-note { order: 2; font-family: var(--mono); font-size: .72rem;
                           letter-spacing: .04em; color: var(--muted); }
  .post { display: flex; gap: .75rem; padding: .55rem .5rem; border-radius: .4rem; align-items: baseline; }
  .post:hover { background: var(--hover); }
  .post .ticon { position: relative; top: .15rem; }
  .post-main { min-width: 0; }
  .post .copy { flex: none; margin-left: auto; font-size: .7rem; padding: .15rem .6rem;
                color: var(--muted); opacity: 0; }
  .post:hover .copy, .post:focus-within .copy { opacity: 1; }
  .post-title { font-family: var(--display); font-size: 1.05rem; color: var(--ink); text-decoration: none; }
  .post-title:hover { text-decoration: underline; text-underline-offset: 3px; }
  .post-title:visited { color: var(--muted); }
  .post-src { font-size: .78rem; color: var(--muted); margin-left: .6rem; white-space: nowrap; }

  .more-wrap { margin-top: 1.25rem; }
  #show-more { padding: .4rem 1.1rem; }

  /* ---------------------------- theme picker ---------------------------- */
  #theme-ui { position: relative; }
  #theme-btn { border: none; background: none; padding: .3rem; border-radius: .4rem;
               color: var(--muted); line-height: 0; }
  #theme-btn:hover { color: var(--ink); background: var(--hover); }
  #theme-btn svg { width: 1.35rem; height: 1.35rem; }
  #theme-menu { position: absolute; right: 0; top: calc(100% + .55rem); z-index: 40;
                min-width: 13.5rem; background: var(--bg); border: 1px solid var(--line);
                border-radius: .6rem; padding: .45rem; box-shadow: 0 .6rem 1.8rem rgba(20, 24, 28, .22); }
  .theme-group { padding: .3rem .55rem .15rem; }
  .theme-opt { display: flex; width: 100%; align-items: center; gap: .65rem;
               border: none; border-radius: .4rem; background: none;
               padding: .35rem .55rem; font-size: .85rem; color: var(--ink); text-align: left; }
  .theme-opt:hover { background: var(--hover); }
  .theme-swatch { flex: none; width: 1.7rem; height: 1.7rem; border-radius: .35rem;
                  border: 1px solid var(--line); display: flex; align-items: center;
                  justify-content: center; font-size: .85rem; line-height: 1; }
  .theme-name { flex: 1; }
  .theme-check { font-family: var(--mono); font-size: .7rem; color: var(--ok); }

  #status-line { margin-top: 2rem; color: var(--muted); font-size: .9rem; }

  @media (prefers-reduced-motion: no-preference) { .post { transition: background .12s ease; } .post .copy { transition: opacity .12s ease; } }
  @media (max-width: 64rem) {
    .cols { flex-direction: column; gap: 0; }
    /* In a column, horizontal flex-bases would become minimum HEIGHTS —
       neutralize them so each block is only as tall as its content. */
    .main { flex: none; max-width: none; }
    .rail { flex: none; width: auto; align-self: stretch; order: -1; }
    #weather { margin-left: 0; }
    .wiki { grid-template-columns: 1fr; gap: 1rem; }

    /* Stacked layouts get compact landscape album cards: thumbnail and
       title only, tapping the card unfolds the blurb. */
    .albums { gap: .8rem; }
    .album { flex-basis: 100%; max-width: none; position: relative; cursor: pointer;
             display: grid; grid-template-columns: 5.2rem minmax(0, 1fr);
             column-gap: .95rem; align-items: center; padding: .8rem 2rem .8rem .95rem; }
    .cover-btn { grid-column: 1; grid-row: 1 / span 3; width: 5.2rem;
                 margin: 0; align-self: center; }
    .album .klabel, .album-head, .album-genres { grid-column: 2; }
    .album-head { margin: .05rem 0; font-size: 1rem; }
    .album-genres { margin-bottom: 0; }
    .album p { grid-column: 1 / -1; display: none; margin-top: .55rem; }
    .album.open p { display: block; }
    .album.open .reception { margin-top: .45rem; }
    .album::after { content: "\25BE"; position: absolute; top: .85rem; right: .9rem;
                    font-size: .72rem; color: rgba(240, 235, 225, .65);
                    transition: transform .15s ease; }
    .album.open::after { transform: rotate(180deg); }
  }
  @media (max-width: 40rem) {
    body { padding: 1.75rem 1.1rem 4rem; }
    h1 { font-size: 1.9rem; }
    .mast-row { position: relative; }
    #theme-ui { position: absolute; top: -.15rem; right: 0; }
    #weather.on { gap: .4rem .9rem; }
    .wx-days { gap: .65rem; flex-wrap: nowrap; }
    .wx-day:nth-child(n+5) { display: none; }   /* four days is plenty on a phone */
    .section-head { font-size: 1.3rem; }
    /* Hanging icon, title wrapping beside it, source on its own line under
       the title — the same shape as the Wikipedia picks. */
    .post-main { flex: 1 1 0; }
    .post-src { display: block; margin: .1rem 0 0; white-space: normal; }
    .post .copy { opacity: 1; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="mast-row">
      <h1 id="mast-date">&nbsp;</h1>
      <div id="weather" aria-label="Weather"></div>
      <div id="theme-ui">
        <button id="theme-btn" aria-label="Change theme" aria-haspopup="true" aria-expanded="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 3a9 9 0 1 0 .2 18h1.6a2.1 2.1 0 0 0 1.5-3.6c-.8-.9-.2-2.4 1-2.4h2.2A2.5 2.5 0 0 0 21 12.4 9.4 9.4 0 0 0 12 3z"/>
            <circle cx="7.8" cy="12.4" r="1" fill="currentColor" stroke="none"/>
            <circle cx="9.6" cy="8.2" r="1" fill="currentColor" stroke="none"/>
            <circle cx="13.9" cy="7.2" r="1" fill="currentColor" stroke="none"/>
          </svg>
        </button>
        <div id="theme-menu" hidden></div>
      </div>
    </div>
  </header>

  <div id="lightbox" hidden>
    <button id="lb-close" aria-label="Close">&#10005;</button>
    <figure>
      <div id="lb-stage"></div>
      <figcaption id="lb-cap"></figcaption>
    </figure>
  </div>

  <div class="cols">
    <div class="main">
      <section id="wiki-sec" aria-label="Wikipedia"></section>
      <h2 class="section-head">Blogroll<span class="dl-note" id="feeds-note"></span></h2>
      <div class="chips" id="chips" role="group" aria-label="Filter by topic"></div>
      <main id="list" aria-live="polite"></main>
      <p id="status-line">Loading posts&hellip;</p>
    </div>
    <aside class="rail">
      <section id="albums-sec" aria-label="Albums"></section>
    </aside>
  </div>

  <footer id="ledger" aria-label="Ledger"></footer>

</div>

<script>
const state = { blogroll: null, wikipedia: null, albums: null, weather: null };
const sectionNotes = {};   // ledger rows for the non-blogroll sections
let activeTopic = "all";
let postsShown = 15;       // "Show more" lifts this to everything
let feedsOpen = false;     // per-feed detail in the footer ledger

const $ = sel => document.querySelector(sel);

function esc(s) {
  const d = document.createElement("div");
  d.textContent = s == null ? "" : s;
  return d.innerHTML;
}

/* -------------------------------- themes -------------------------------- */

const THEMES = [
  { id: "broadsheet", name: "Broadsheet", dark: false, bg: "#F7F3EB", ink: "#20262B", face: "'Iowan Old Style', Palatino, Georgia, serif" },
  { id: "preprint",   name: "Preprint",   dark: false, bg: "#FEFEFC", ink: "#1B1B1F", face: "Baskerville, Georgia, serif" },
  { id: "gallery",    name: "Gallery",    dark: false, bg: "#FAFAF7", ink: "#26282B", face: "Optima, Candara, 'Gill Sans', sans-serif" },
  { id: "slate",      name: "Slate",      dark: true,  bg: "#242B34", ink: "#E6E1D5", face: "'New York', ui-serif, Georgia, serif" },

];

if (!THEMES.some(t => t.id === currentTheme)) currentTheme = "broadsheet";
const isDarkTheme = () => THEMES.find(t => t.id === currentTheme)?.dark ?? false;

// The topic palette is tuned for light grounds; on dark themes, lift each
// colour's lightness (and ease its saturation) so dots and chips stay legible.
function themeDot(hex) {
  if (!isDarkTheme() || !/^#[0-9a-f]{6}$/i.test(hex)) return hex;
  const [r, g, b] = [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16) / 255);
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn;
  let h = 0, l = (mx + mn) / 2, s = d === 0 ? 0 : d / (1 - Math.abs(2 * l - 1));
  if (d) h = mx === r ? ((g - b) / d + 6) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
  l = Math.max(l, .68); s = Math.min(s * .85, .5);
  const c = (1 - Math.abs(2 * l - 1)) * s, x = c * (1 - Math.abs(h % 2 - 1)), m = l - c / 2;
  const [R, G, B] = h < 1 ? [c, x, 0] : h < 2 ? [x, c, 0] : h < 3 ? [0, c, x]
    : h < 4 ? [0, x, c] : h < 5 ? [x, 0, c] : [c, 0, x];
  return "#" + [R, G, B].map(v => Math.round((v + m) * 255).toString(16).padStart(2, "0")).join("");
}

function applyTheme(id) {
  currentTheme = THEMES.some(t => t.id === id) ? id : "broadsheet";
  if (currentTheme === "broadsheet") delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme = currentTheme;
  try { localStorage.setItem("ultrafilter:theme", currentTheme); } catch {}
  renderWiki();        // re-tint topic dots for the new ground
  renderBlogroll();
}

// Today, in the viewer's clock: "2026-07-28" and "Tuesday 28 July".
const TODAY_KEY = new Intl.DateTimeFormat("en-CA",
  { year: "numeric", month: "2-digit", day: "2-digit" }).format(new Date());

function prettyDate(key) {
  const d = new Date(`${key}T12:00:00`);
  if (isNaN(d)) return "";
  return d.toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long" });
}

// Section headers carry a date only when it isn't today's (stale or rolled over).
function sectionHead(label, dataKey, note) {
  const dated = dataKey && dataKey !== TODAY_KEY
    ? `<span class="sh-date">&middot; ${esc(prettyDate(dataKey))}</span>` : "";
  return `<h2 class="section-head">${esc(label)}${dated}${note ? `<span class="dl-note">${esc(note)}</span>` : ""}</h2>`;
}

// WMO weather codes -> [description, icon key]
function wmo(code) {
  const c = Number(code);
  if (c === 0) return ["Clear", "sun"];
  if (c === 1) return ["Mainly clear", "sun"];
  if (c === 2) return ["Partly cloudy", "cloudsun"];
  if (c === 3) return ["Overcast", "cloud"];
  if (c === 45 || c === 48) return ["Fog", "fog"];
  if (c >= 51 && c <= 57) return ["Drizzle", "rain"];
  if (c >= 61 && c <= 67) return ["Rain", "rain"];
  if (c >= 71 && c <= 77) return ["Snow", "snow"];
  if (c >= 80 && c <= 82) return ["Showers", "rain"];
  if (c === 85 || c === 86) return ["Snow showers", "snow"];
  if (c >= 95) return ["Thunderstorm", "storm"];
  return ["", "cloud"];
}

async function loadWeather() {
  const cfg = state.weather?.config;
  if (!cfg) { sectionNotes.weather = { cls: "dim", text: "no config" }; renderLedger(); return; }
  try {
    const u = new URL("https://api.open-meteo.com/v1/forecast");
    u.searchParams.set("latitude", cfg.latitude);
    u.searchParams.set("longitude", cfg.longitude);
    u.searchParams.set("current", "temperature_2m,apparent_temperature,weather_code,wind_speed_10m");
    u.searchParams.set("daily", "weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max");
    u.searchParams.set("temperature_unit", cfg.temperatureUnit || "celsius");
    u.searchParams.set("wind_speed_unit", cfg.windSpeedUnit || "mph");
    u.searchParams.set("timezone", cfg.timezone || "auto");
    u.searchParams.set("forecast_days", cfg.days || 5);
    const res = await fetch(u, { signal: AbortSignal.timeout(12000) });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    renderWeather(cfg, await res.json());
    sectionNotes.weather = { cls: "ok", text: "live" };
  } catch (err) {
    sectionNotes.weather = { cls: "fail", text: `failed — ${err.message || err}` };
  }
  renderLedger();
}

function renderWeather(cfg, w) {
  const cur = w.current || {};
  const [desc, ic] = wmo(cur.weather_code);
  const temp = Math.round(cur.temperature_2m);
  const feels = Math.round(cur.apparent_temperature);
  const bits = [desc, Math.abs(feels - temp) >= 3 ? `feels ${feels}°` : null,
                cur.wind_speed_10m != null ? `wind ${Math.round(cur.wind_speed_10m)} ${cfg.windSpeedUnit || "mph"}` : null]
    .filter(Boolean).join(" · ");

  const d = w.daily || {};
  const days = (d.time || []).map((t, i) => {
    const [, dic] = wmo(d.weather_code?.[i]);
    const label = i === 0 ? "Today"
      : new Date(t + "T12:00:00").toLocaleDateString("en-GB", { weekday: "short" });
    const pop = d.precipitation_probability_max?.[i];
    return `<div class="wx-day">
      <div class="d">${esc(label)} ${wxIcon(dic)}</div>
      <div class="t">${Math.round(d.temperature_2m_max?.[i])}° <span class="lo">${Math.round(d.temperature_2m_min?.[i])}°</span>${pop >= 15 ? ` <span class="p">${pop}%</span>` : ""}</div>
    </div>`;
  }).join("");

  $("#weather").innerHTML = `
    <div class="wx-now">
      ${wxIcon(ic)}
      <span class="wx-temp">${temp}°</span>
      <span class="wx-desc">${esc(cfg.place)}<br>${esc(bits)}</span>
    </div>
    <div class="wx-days">${days}</div>`;
  $("#weather").classList.add("on");
}

// The album accent palette: one colour per category — the card's ground, and

function ringsSvg(acc, cls) {

// Spotify oEmbed thumbnails are the 300px variant; the 640px variant lives at
// the same URL with a different size segment. Try it, fall back on error.
function hiRes(url) {
  return url.includes("00001e02") ? url.replace("00001e02", "0000b273") : url;
}

function openLightbox(i) {
  const al = state.albums?.albums?.[i];
  if (!al) return;
  const acc = ACCENTS[i % ACCENTS.length];

    stage.innerHTML = ringsSvg(acc, "lb-art");

  $("#lb-cap").textContent = `${al.artist} — ${al.album}${al.year ? ` (${al.year})` : ""}`;

let rerolling = false;

// "Another three": redo the builder's random draw client-side. The topic map
// ships in wikipedia.json; both Wikipedia APIs answer anonymous CORS requests.
async function rerollPicks() {
  const w = state.wikipedia;
  if (!w?.topics?.length || rerolling) return;
  rerolling = true;
  $("#reroll")?.classList.add("spin");
  try {
    const pool = [...w.topics].sort(() => Math.random() - .5).slice(0, 3);
    const exclude = new Set([w.tfa?.title, ...(w.picks || []).map(p => p.title)].filter(Boolean));
    const fresh = [];
    for (const t of pool) {
      try {
        const q = `incategory:"Good articles" articletopic:${t.articleTopics.join("|")}`;
        const s = await (await fetch(
          `https://en.wikipedia.org/w/api.php?action=query&list=search&format=json&formatversion=2&origin=*` +
          `&srsearch=${encodeURIComponent(q)}&srsort=random&srlimit=5&srprop=`,
          { signal: AbortSignal.timeout(10000) })).json();
        const hit = (s?.query?.search || []).find(r => !exclude.has(r.title));
        if (!hit) continue;
        const sum = await (await fetch(
          `https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(hit.title.replace(/ /g, "_"))}`,
          { signal: AbortSignal.timeout(10000) })).json();
        const title = sum?.titles?.normalized || hit.title;
        exclude.add(title);
        fresh.push({
          topicId: t.id, topicLabel: t.label, title,
          description: sum?.description || "",
          extract: sum?.extract || "",
          url: sum?.content_urls?.desktop?.page || `https://en.wikipedia.org/wiki/${hit.title.replace(/ /g, "_")}`,
          thumbnail: sum?.thumbnail?.source || null,
        });
      } catch {}
    }
    if (fresh.length) {
      state.wikipedia = { ...w, picks: fresh };
      renderWiki();
    }
  } finally {
    rerolling = false;
    $("#reroll")?.classList.remove("spin");
  }
}

function renderWiki() {
  const w = state.wikipedia;
  if (!w || (!w.tfa && !w.picks?.length)) {
    sectionNotes.wikipedia = { cls: "fail", text: `failed — ${w?.error || "no data"}` };
    return;
  }
  sectionNotes.wikipedia = { cls: w.stale ? "dim" : "ok", text: `${w.stale ? "stale · " : ""}${w.date}` };

  const tfa = w.tfa ? `<div class="tfa">
      <span class="klabel">Featured article</span><br>
      <a class="tfa-title" href="${esc(w.tfa.url)}" target="_blank" rel="noopener">${esc(w.tfa.title)}</a>
      <span class="tfa-desc">${esc(w.tfa.description)}</span>
      <p class="tfa-extract">${esc(w.tfa.extract)}</p>
    </div>` : "<div></div>";

  const picks = (w.picks || []).map(p => `
    <div class="wpick" style="--dot:${topicColor(p.topicId)}">
      ${icon(p.topicId)}
      <span class="wpick-main">
        <a class="wpick-title" href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.title)}</a>
        <span class="wpick-desc" title="${esc(p.description)}">${esc(p.description)}</span>
      </span>
    </div>`).join("");

  const dated = w.date && w.date !== TODAY_KEY
    ? `<span class="sh-date">&middot; ${esc(prettyDate(w.date))}</span>` : "";
  const reroll = w.topics?.length
    ? `<span class="dl-note"><button id="reroll" class="reroll" title="Another three"
         aria-label="Show another three articles">${DICE}</button></span>` : "";
  $("#wiki-sec").innerHTML =
    `<h2 class="section-head">Wikipedia${dated}${reroll}</h2>` +
    `<div class="wiki">${tfa}<div class="wpicks">${picks}</div></div>`;
  $("#wiki-sec").classList.add("on");
}

function visibleCount(topicId) {
  const posts = state.blogroll?.posts || [];
  return topicId === "all" ? posts.length : posts.filter(p => p.topics.includes(topicId)).length;
}

function renderChips() {
  const chips = state.blogroll?.topics || [];
  $("#chips").innerHTML = chips.map(c => `
    <button class="chip" data-topic="${esc(c.id)}" aria-pressed="${activeTopic === c.id}"
      style="--dot:${topicColor(c.id)}">
      ${icon(c.id)}
      ${esc(c.label)} <span class="n">${visibleCount(c.id)}</span>
    </button>`).join("");
  // Clicking the active chip deselects it, returning to the unfiltered view.
  document.querySelectorAll(".chip").forEach(btn =>
    btn.addEventListener("click", () => {
      activeTopic = activeTopic === btn.dataset.topic ? "all" : btn.dataset.topic;
      renderBlogroll();
    }));
}

function renderLedger() {
  const b = state.blogroll;

  const seg = (label, n) => n ? `<span class="lsec">${label}<span class="ledger-status ${n.cls}">${esc(n.text)}</span></span>` : "";

  const feedRows = (b?.feeds || []).map(f => {
    const ok = f.status === "ok";
    const label = ok
      ? `${f.count} post${f.count === 1 ? "" : "s"}${f.source && f.source !== "direct" ? ` · via ${esc(f.source)}` : ""}`
      : `failed — ${esc(f.error || "unknown")}`;
    return `<div class="ledger-row">
      <a href="${esc(f.site)}" target="_blank" rel="noopener" title="${esc(f.author)}">${esc(f.name)}</a>
      <span class="ledger-status ${ok ? "ok" : "fail"}">${label}</span>
    </div>`;
  }).join("");

  const bNote = b?.posts
    ? { cls: b.stale ? "dim" : "ok", text: `${b.stale ? "stale · " : ""}${b.feedsOk}/${b.feedsTotal} feeds` }
    : { cls: "fail", text: `failed — ${b?.error || "no data"}` };
  const blogrollSeg = feedRows
    ? `<button class="lsec" id="lfeeds-toggle" aria-expanded="${feedsOpen}">
        <span><span class="lcaret${feedsOpen ? " open" : ""}">&#9656;</span>Blogroll</span>
        <span class="ledger-status ${bNote.cls}">${esc(bNote.text)}</span></button>`
    : seg("Blogroll", bNote);

  $("#ledger").innerHTML =
    `<div class="ledger-sections"><span class="klabel">Ledger</span>` + blogrollSeg +
    seg("Wikipedia", sectionNotes.wikipedia) +
    seg("Albums", sectionNotes.albums) +
    seg("Weather", sectionNotes.weather) + `</div>` +
    (feedsOpen && feedRows ? `<div class="lfeeds">${feedRows}</div>` : "");

  $("#lfeeds-toggle")?.addEventListener("click", () => {
    feedsOpen = !feedsOpen;
    renderLedger();
  });
}

function renderList() {
  const all = (state.blogroll?.posts || [])
    .filter(p => activeTopic === "all" || p.topics.includes(activeTopic));

  if (!all.length) { $("#list").innerHTML = ""; return; }
  const posts = all.slice(0, postsShown);

  let html = "", lastKey = null;
  for (const p of posts) {
    const d = p.date ? new Date(p.date) : null;
    const key = d && !isNaN(d) ? dateKey(d) : "Undated";
    if (key !== lastKey) { html += `<h2 class="dateline">${key}</h2>`; lastKey = key; }
    html += `<div class="post" style="--dot:${topicColor(p.topics[0])}">
      ${icon(p.topics[0])}
      <span class="post-main">
        <a class="post-title" href="${esc(p.link)}" target="_blank" rel="noopener">${esc(p.title)}</a>
        <span class="post-src">${esc(p.feed)}</span>
      </span>
      <button class="copy" data-link="${esc(p.link)}">Copy link</button>
    </div>`;
  }
  if (all.length > posts.length) {
    html += `<div class="more-wrap"><button id="show-more">Show ${all.length - posts.length} more</button></div>`;
  }
  $("#list").innerHTML = html;
}

// "Monday 27 July", with the year only when it isn't the current one.
function dateKey(d) {
  const weekday = d.toLocaleDateString("en-GB", { weekday: "long" });
  const month = d.toLocaleDateString("en-GB", { month: "long" });
  const year = d.getFullYear();
  const suffix = year === new Date().getFullYear() ? "" : ` ${year}`;
  return `${weekday} ${d.getDate()} ${month}${suffix}`;
}

function renderStatus() {
  const b = state.blogroll;
  if (!b?.posts) {
    $("#feeds-note").textContent = "no data";
    $("#status-line").textContent =
      `Couldn't load data/blogroll.json${b?.error ? ` (${b.error})` : ""}. If this is a fresh checkout, the scheduled job hasn't run yet — trigger it from the Actions tab, or run "npm ci && node scripts/build.mjs" locally.`;
    return;
  }
  const failed = (b.feeds || []).filter(f => f.status !== "ok").length;
  $("#feeds-note").textContent = `${b.feedsOk} of ${b.feedsTotal} feeds` + (failed ? ` (${failed} failed)` : "");
  const when = b.generated ? new Date(b.generated) : null;
  $("#status-line").textContent =
    `${(b.posts || []).length} posts · updated ${when ? relativeTime(when) : "unknown"}.`;
}

function relativeTime(then) {
  const mins = Math.round((Date.now() - then.getTime()) / 60000);
  if (mins < 2) return "just now";
  if (mins < 60) return `${mins} minutes ago`;
  const hrs = Math.round(mins / 60);
  if (hrs < 24) return `${hrs} hour${hrs === 1 ? "" : "s"} ago`;
  const days = Math.round(hrs / 24);
  return `${days} day${days === 1 ? "" : "s"} ago`;
}

function renderBlogroll() {
  renderChips();
  renderLedger();
  renderList();
  renderStatus();
}

async function loadJson(name) {
  // Cache-buster so a refreshed build shows up without a hard reload.
  const res = await fetch(`./data/${name}.json?t=${Date.now()}`, { cache: "no-store" });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}

async function load() {
  $("#mast-date").textContent = prettyDate(TODAY_KEY);

  const [b, w, a, wx] = await Promise.allSettled(
    ["blogroll", "wikipedia", "albums", "weather"].map(loadJson));
  state.blogroll = b.status === "fulfilled" ? b.value : { error: b.reason?.message };
  state.wikipedia = w.status === "fulfilled" ? w.value : { error: w.reason?.message };
  state.albums = a.status === "fulfilled" ? a.value : { error: a.reason?.message, status: "failed" };
  state.weather = wx.status === "fulfilled" ? wx.value : null;

  renderAlbums();
  renderWiki();
  renderBlogroll();
  loadWeather();   // async; re-renders the ledger row when it settles
}

/**
 * On desktops, album links first try the Spotify app. A page cannot know
 * whether the app is installed, so this is an attempt-and-fall-back: navigate
 * to the spotify: URI, and if the browser hasn't lost focus a moment later
 * (nothing answered the URI), open the web player instead. Phones are left
 * alone — open.spotify.com already deep-links into the app there.
 */
function maybeOpenInApp(e, href) {
  const m = href.match(/open\.spotify\.com\/album\/([A-Za-z0-9]+)/);
  if (!m || !window.matchMedia("(hover: hover) and (pointer: fine)").matches) return;
  e.preventDefault();
  let answered = false;
  const settle = () => { answered = true; };
  addEventListener("blur", settle, { once: true });
  document.addEventListener("visibilitychange", settle, { once: true });
  setTimeout(() => {
    removeEventListener("blur", settle);
    document.removeEventListener("visibilitychange", settle);
    if (!answered && !document.hidden) window.open(href, "_blank", "noopener");
  }, 1200);
  location.href = `spotify:album:${m[1]}`;
}

$("#albums-sec").addEventListener("click", e => {
  const btn = e.target.closest(".cover-btn");
  if (btn) return openLightbox(Number(btn.dataset.i));
  const link = e.target.closest("a");
  if (link) return maybeOpenInApp(e, link.href);   // search links pass through
  // On stacked layouts the card itself is an accordion.
  const card = e.target.closest(".album");
  if (card && window.matchMedia("(max-width: 64rem)").matches) {
    card.classList.toggle("open");
    card.setAttribute("aria-expanded", card.classList.contains("open"));
  }
});
$("#wiki-sec").addEventListener("click", e => {
  if (e.target.closest("#reroll")) rerollPicks();
});
$("#lightbox").addEventListener("click", e => {
  // The X, or anywhere that isn't the artwork itself, closes the view.
  if (!e.target.closest(".lb-art")) closeLightbox();
});
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if (!$("#lightbox").hidden) closeLightbox();
  else closeThemeMenu();
});

$("#theme-btn").addEventListener("click", e => {
  e.stopPropagation();
  const menu = $("#theme-menu");
  if (menu.hidden) { renderThemeMenu(); menu.hidden = false; $("#theme-btn").setAttribute("aria-expanded", "true"); }
  else closeThemeMenu();
});
$("#theme-menu").addEventListener("click", e => {
  const opt = e.target.closest(".theme-opt");
  if (!opt) return;
  applyTheme(opt.dataset.theme);
  renderThemeMenu();
});
document.addEventListener("click", e => {
  if (!e.target.closest("#theme-ui")) closeThemeMenu();
});

$("#list").addEventListener("click", async e => {
  if (e.target.id === "show-more") {
    postsShown = Infinity;
    renderList();
    return;
  }
  const btn = e.target.closest(".copy");
  if (!btn) return;
  try {
    await navigator.clipboard.writeText(btn.dataset.link);
    btn.textContent = "Copied";
  } catch {
    btn.textContent = "Couldn't copy";
  }
  setTimeout(() => { btn.textContent = "Copy link"; }, 1200);
});

load();
</script>
