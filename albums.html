<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<title>Ultrafilter · The record crate</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script>
  // Apply the stored theme before first paint so there is no flash.
  try {
    const t = localStorage.getItem("ultrafilter:theme");
    if (t) document.documentElement.dataset.theme = t;
  } catch {}
</script>
<style>
  /* Themes — kept in step with index.html. */
  :root {
    --bg: #F7F3EB; --ink: #20262B; --muted: #6B7278; --faint: #9AA1A6;
    --line: #E0D9CB; --hover: #EFEAE0; --accent: #4756A8; --ok: #557A33; --fail: #A33B2E;
    --display: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    --body: Seravek, "Gill Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
    --mono: "SF Mono", Menlo, Consolas, monospace;
  }
  html[data-theme="preprint"] {
    --bg: #FEFEFC; --ink: #1B1B1F; --muted: #5F6268; --faint: #9B9EA4;
    --line: #E5E4DF; --hover: #F1F0EB; --accent: #3A5BA0; --ok: #46783A; --fail: #A63B2E;
    --display: Baskerville, "Libre Baskerville", "Times New Roman", Georgia, serif;
    --body: Charter, "Bitstream Charter", "Iowan Old Style", Georgia, serif;
    --mono: "Courier New", Courier, monospace;
  }
  html[data-theme="gallery"] {
    --bg: #FAFAF7; --ink: #26282B; --muted: #6F747B; --faint: #A2A6AB;
    --line: #E4E3DE; --hover: #F0EFEA; --accent: #497A8A; --ok: #5B8046; --fail: #B0503F;
    --display: Optima, Candara, "Gill Sans", "Segoe UI", sans-serif;
    --body: "Avenir Next", Avenir, "Helvetica Neue", Helvetica, sans-serif;
    --mono: "SF Mono", Menlo, Consolas, monospace;
  }
  html[data-theme="slate"] {
    --bg: #242B34; --ink: #E6E1D5; --muted: #9AA2AC; --faint: #67707B;
    --line: #3A434F; --hover: #2C3541; --accent: #98ABDC; --ok: #98BC7D; --fail: #DB9384;
    --display: "New York", ui-serif, Georgia, serif;
    --body: system-ui, -apple-system, "Helvetica Neue", sans-serif;
    --mono: "SF Mono", Menlo, Consolas, monospace;
  }
  html[data-theme="console"] {
    --bg: #17191B; --ink: #D6D3C9; --muted: #8E9296; --faint: #5C6165;
    --line: #2B2E31; --hover: #202326; --accent: #93B383; --ok: #93B383; --fail: #CD8B7C;
    --display: "SF Mono", Menlo, Consolas, monospace;
    --body: "SF Mono", Menlo, Consolas, monospace;
    --mono: "SF Mono", Menlo, Consolas, monospace;
  }
  html[data-theme="nocturne"] {
    --bg: #221E26; --ink: #E9E2D8; --muted: #A79DAC; --faint: #746B79;
    --line: #37313E; --hover: #2B2531; --accent: #C39FB4; --ok: #9CBB80; --fail: #D68D7E;
    --display: "Hoefler Text", "Palatino Linotype", Palatino, Georgia, serif;
    --body: Seravek, "Gill Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
    --mono: Menlo, Consolas, monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { font-size: 16px; }
  body { background: var(--bg); color: var(--ink); font-family: var(--body);
         line-height: 1.5; padding: 2.5rem 2rem 5rem; }
  .wrap { max-width: 80rem; }

  header { border-bottom: 3px double var(--ink); padding-bottom: .5rem; }
  .mast-row { display: flex; align-items: baseline; justify-content: space-between;
              flex-wrap: wrap; gap: .5rem 2rem; }
  h1 { font-family: var(--display); font-weight: 400; font-size: 2.35rem;
       letter-spacing: .01em; line-height: 1.15; }
  .mast-tools { display: flex; align-items: center; gap: 1rem; margin-left: auto; }
  .back { font-family: var(--mono); font-size: .72rem; letter-spacing: .05em;
          text-transform: uppercase; color: var(--muted); text-decoration: none; }
  .back:hover { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }

  button { font-family: var(--body); font-size: .8rem; color: var(--ink); background: none;
           border: 1px solid var(--line); border-radius: 999px; padding: .3rem .85rem; cursor: pointer; }
  button:hover { background: var(--hover); }
  button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .klabel { font-family: var(--mono); font-size: .66rem; letter-spacing: .09em;
            text-transform: uppercase; color: var(--muted); }

  /* ------------------------------ controls ------------------------------ */
  #controls { display: flex; flex-wrap: wrap; align-items: center; gap: .6rem 1.6rem;
              margin-top: 1.4rem; }
  .ctl-group { display: flex; flex-wrap: wrap; align-items: center; gap: .45rem; }
  .ctl-group > .klabel { margin-right: .15rem; }
  .chip { display: inline-flex; align-items: center; gap: .45rem; border: 1px solid var(--line);
          border-radius: 999px; background: none; padding: .32rem .85rem; font-size: .82rem; }
  .chip[aria-pressed="true"] { background: color-mix(in srgb, var(--ink) 10%, var(--bg));
                               border-color: var(--muted); }
  .cdot { width: .55rem; height: .55rem; border-radius: 999px; background: var(--dot, var(--faint)); }
  select, input[type="search"] {
    font-family: var(--body); font-size: .82rem; color: var(--ink); background: var(--bg);
    border: 1px solid var(--line); border-radius: 999px; padding: .3rem .8rem; }
  input[type="search"] { min-width: 11rem; }
  select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #count { font-family: var(--mono); font-size: .72rem; color: var(--muted); margin-left: auto; }

  /* -------------------------------- crate -------------------------------- */
  .dateline { font-family: var(--mono); font-size: .75rem; letter-spacing: .04em;
              color: var(--muted); margin: 2.25rem 0 .9rem; display: flex;
              align-items: center; gap: .75rem; }
  .dateline::after { content: ""; flex: 1; border-top: 1px solid var(--line); }

  /* Three landscape sleeves per row: in the Recommended view, one row is one
     day's picks, columns lining up Focus / Enjoy / Explore. */
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.1rem; }
  .grid + .grid { margin-top: 1.1rem; }
  .tile { background: var(--acc, var(--hover)); color: #F0EBE1; border-radius: .5rem;
          padding: .8rem .9rem; cursor: pointer; border: none; text-align: left;
          display: flex; align-items: center; gap: .9rem; }
  .tile:hover { background: var(--acc); transform: translateY(-2px);
                box-shadow: 0 .45rem 1.1rem rgba(20, 24, 28, .3); }
  @media (prefers-reduced-motion: no-preference) {
    .tile { transition: transform .14s ease, box-shadow .14s ease; }
  }
  .tile-cover { width: 7.5rem; flex: none; aspect-ratio: 1; object-fit: cover;
                border-radius: .35rem; display: block; align-self: center; }
  .tile-body { display: flex; flex-direction: column; gap: .1rem; min-width: 0; }
  .tile .klabel { color: rgba(240, 235, 225, .8); }
  .tile-artist { font-family: var(--display); font-size: .98rem; line-height: 1.25; }
  .tile-album { font-family: var(--display); font-style: italic; font-size: .92rem;
                line-height: 1.25; }
  .tile-year { font-style: normal; font-size: .8rem; color: rgba(240, 235, 225, .75); }
  .tile-genres { font-family: var(--mono); font-size: .62rem; color: rgba(240, 235, 225, .75);
                 margin-top: .25rem; }

  #status-line { margin-top: 2rem; color: var(--muted); font-size: .9rem; }

  /* ---------------------------- detail overlay ---------------------------- */
  #detail { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center;
            justify-content: center; padding: 1.25rem; background: rgba(32, 38, 43, .35);
            -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
  #detail[hidden] { display: none; }
  .sleeve { background: var(--acc, #3F5164); color: #F0EBE1; border-radius: .6rem;
            box-shadow: 0 1.5rem 4rem rgba(20, 24, 28, .5); max-width: 46rem; width: 100%;
            max-height: min(88vh, 46rem); overflow: auto; padding: 1.5rem;
            display: grid; grid-template-columns: 15rem minmax(0, 1fr); gap: 1.4rem; }
  .sleeve-cover { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: .4rem;
                  display: block; }
  .sleeve .klabel { color: rgba(240, 235, 225, .8); }
  .sleeve-when { font-family: var(--mono); font-size: .66rem; letter-spacing: .05em;
                 color: rgba(240, 235, 225, .65); margin-top: .15rem; }
  .sleeve-artist { font-family: var(--display); font-size: 1.35rem; line-height: 1.25;
                   margin-top: .45rem; }
  .sleeve-album { font-family: var(--display); font-style: italic; font-size: 1.15rem; }
  .sleeve-album a { color: #F0EBE1; text-decoration: none; }
  .sleeve-album a:hover { text-decoration: underline; text-underline-offset: 3px; }
  .sleeve-year { font-style: normal; font-size: .9rem; color: rgba(240, 235, 225, .75); }
  .sleeve-genres { font-family: var(--mono); font-size: .68rem;
                   color: rgba(240, 235, 225, .85); margin: .35rem 0 .75rem; }
  .sleeve p { font-size: .87rem; line-height: 1.5; }
  .sleeve .reception { margin-top: .55rem; color: rgba(240, 235, 225, .82); }
  .srch { font-family: var(--mono); font-size: .62rem; color: rgba(240, 235, 225, .6);
          margin-left: .3rem; }
  #detail-close { position: fixed; top: 1.1rem; right: 1.25rem; width: 2.6rem; height: 2.6rem;
                  border: none; border-radius: 999px; background: rgba(32, 38, 43, .55);
                  color: #F0EBE1; font-size: 1.35rem; line-height: 1; cursor: pointer; }
  #detail-close:hover { background: rgba(32, 38, 43, .8); }

  /* ---------------------------- theme picker ---------------------------- */
  #theme-ui { position: relative; }
  #theme-btn { border: none; background: none; padding: .3rem; border-radius: .4rem;
               color: var(--muted); line-height: 0; }
  #theme-btn:hover { color: var(--ink); background: var(--hover); }
  #theme-btn svg { width: 1.35rem; height: 1.35rem; }
  #theme-menu { position: absolute; right: 0; top: calc(100% + .55rem); z-index: 40;
                min-width: 13.5rem; background: var(--bg); border: 1px solid var(--line);
                border-radius: .6rem; padding: .45rem;
                box-shadow: 0 .6rem 1.8rem rgba(20, 24, 28, .22); }
  .theme-group { padding: .3rem .55rem .15rem; }
  .theme-opt { display: flex; width: 100%; align-items: center; gap: .65rem; border: none;
               border-radius: .4rem; background: none; padding: .35rem .55rem;
               font-size: .85rem; color: var(--ink); text-align: left; }
  .theme-opt:hover { background: var(--hover); }
  .theme-swatch { flex: none; width: 1.7rem; height: 1.7rem; border-radius: .35rem;
                  border: 1px solid var(--line); display: flex; align-items: center;
                  justify-content: center; font-size: .85rem; line-height: 1; }
  .theme-name { flex: 1; }
  .theme-check { font-family: var(--mono); font-size: .7rem; color: var(--ok); }

  /* Below this the three-across day rows get too cramped; landscape tiles
     stack one per row instead. */
  @media (max-width: 56rem) {
    .grid { grid-template-columns: 1fr; gap: .8rem; }
    .tile-cover { width: 5.8rem; }
  }
  @media (max-width: 40rem) {
    body { padding: 1.75rem 1.1rem 4rem; }
    h1 { font-size: 1.9rem; }
    .sleeve { grid-template-columns: 1fr; max-height: 88vh; }
    .sleeve-cover { max-width: 15rem; }
    #count { margin-left: 0; width: 100%; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="mast-row">
      <h1>The record crate</h1>
      <div class="mast-tools">
        <a class="back" href="./">&larr; Today</a>
        <div id="theme-ui">
          <button id="theme-btn" aria-label="Change theme" aria-haspopup="true" aria-expanded="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
              stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 3a9 9 0 1 0 .2 18h1.6a2.1 2.1 0 0 0 1.5-3.6c-.8-.9-.2-2.4 1-2.4h2.2A2.5 2.5 0 0 0 21 12.4 9.4 9.4 0 0 0 12 3z"/>
              <circle cx="7.8" cy="12.4" r="1" fill="currentColor" stroke="none"/>
              <circle cx="9.6" cy="8.2" r="1" fill="currentColor" stroke="none"/>
              <circle cx="13.9" cy="7.2" r="1" fill="currentColor" stroke="none"/>
            </svg>
          </button>
          <div id="theme-menu" hidden></div>
        </div>
      </div>
    </div>
  </header>

  <div id="controls">
    <div class="ctl-group" id="sorts" role="group" aria-label="Sort">
      <span class="klabel">Sort</span>
      <button class="chip" data-sort="rec" aria-pressed="true">Recommended</button>
      <button class="chip" data-sort="year" aria-pressed="false">Release year</button>
      <button class="chip" data-sort="artist" aria-pressed="false">Artist</button>
    </div>
    <div class="ctl-group" id="cats" role="group" aria-label="Category"></div>
    <div class="ctl-group">
      <select id="genre" aria-label="Genre"><option value="">All genres</option></select>
      <input id="q" type="search" placeholder="Search artist or album" aria-label="Search">
    </div>
    <span id="count"></span>
  </div>

  <main id="crate" aria-live="polite"></main>
  <p id="status-line">Loading the crate&hellip;</p>

  <div id="detail" hidden>
    <button id="detail-close" aria-label="Close">&#10005;</button>
    <div class="sleeve" id="sleeve"></div>
  </div>

</div>

<script>
const $ = sel => document.querySelector(sel);
function esc(s) {
  const d = document.createElement("div");
  d.textContent = s == null ? "" : s;
  return d.innerHTML;
}

/* -------------------------------- themes -------------------------------- */
const THEMES = [
  { id: "broadsheet", name: "Broadsheet", dark: false, bg: "#F7F3EB", ink: "#20262B", face: "'Iowan Old Style', Palatino, Georgia, serif" },
  { id: "preprint",   name: "Preprint",   dark: false, bg: "#FEFEFC", ink: "#1B1B1F", face: "Baskerville, Georgia, serif" },
  { id: "gallery",    name: "Gallery",    dark: false, bg: "#FAFAF7", ink: "#26282B", face: "Optima, Candara, 'Gill Sans', sans-serif" },
  { id: "slate",      name: "Slate",      dark: true,  bg: "#242B34", ink: "#E6E1D5", face: "'New York', ui-serif, Georgia, serif" },
  { id: "console",    name: "Console",    dark: true,  bg: "#17191B", ink: "#D6D3C9", face: "'SF Mono', Menlo, monospace" },
  { id: "nocturne",   name: "Nocturne",   dark: true,  bg: "#221E26", ink: "#E9E2D8", face: "'Hoefler Text', Palatino, Georgia, serif" },
];
let currentTheme = document.documentElement.dataset.theme || "broadsheet";
if (!THEMES.some(t => t.id === currentTheme)) currentTheme = "broadsheet";

function applyTheme(id) {
  currentTheme = THEMES.some(t => t.id === id) ? id : "broadsheet";
  if (currentTheme === "broadsheet") delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme = currentTheme;
  try { localStorage.setItem("ultrafilter:theme", currentTheme); } catch {}
}
function renderThemeMenu() {
  const groups = [["Light", THEMES.filter(t => !t.dark)], ["Dark", THEMES.filter(t => t.dark)]];
  $("#theme-menu").innerHTML = groups.map(([label, list]) =>
    `<div class="theme-group klabel">${label}</div>` + list.map(t => `
      <button class="theme-opt" data-theme="${t.id}">
        <span class="theme-swatch" style="background:${t.bg};color:${t.ink};font-family:${t.face}">Aa</span>
        <span class="theme-name">${esc(t.name)}</span>
        ${t.id === currentTheme ? '<span class="theme-check">&#10003;</span>' : ""}
      </button>`).join("")).join("");
}
function closeThemeMenu() {
  $("#theme-menu").hidden = true;
  $("#theme-btn").setAttribute("aria-expanded", "false");
}
$("#theme-btn").addEventListener("click", e => {
  e.stopPropagation();
  const menu = $("#theme-menu");
  if (menu.hidden) { renderThemeMenu(); menu.hidden = false; $("#theme-btn").setAttribute("aria-expanded", "true"); }
  else closeThemeMenu();
});
$("#theme-menu").addEventListener("click", e => {
  const opt = e.target.closest(".theme-opt");
  if (opt) { applyTheme(opt.dataset.theme); renderThemeMenu(); }
});
document.addEventListener("click", e => {
  if (!e.target.closest("#theme-ui")) closeThemeMenu();
});

/* -------------------------------- data --------------------------------- */
const ACCENTS = { focus: "#3F5164", familiar_artist: "#6E5024", new_artist: "#603F6A" };
const CAT_LABELS = { focus: "Focus", familiar_artist: "Enjoy", new_artist: "Explore" };

let entries = [];
let sortMode = "rec";
const catsOn = new Set(Object.keys(ACCENTS));
let genreOn = "";
let query = "";

function ringsSvg(acc, cls) {
  const rings = [20, 46, 72, 98, 124]
    .map(r => `<circle cx="150" cy="150" r="${r}" fill="none" stroke="#F0EBE1" stroke-width="3"/>`)
    .join("");
  return `<svg class="${cls}" viewBox="0 0 300 300" aria-hidden="true">
    <rect width="300" height="300" fill="${acc}"/>${rings}</svg>`;
}

function prettyDate(key) {
  const d = new Date(`${key}T12:00:00`);
  if (isNaN(d)) return key;
  return d.toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
}

function normGenre(g) { return g.trim().toLowerCase(); }

function filtered() {
  const q = query.trim().toLowerCase();
  return entries.filter(e =>
    catsOn.has(e.category) &&
    (!genreOn || (e.genres || []).some(g => normGenre(g) === genreOn)) &&
    (!q || `${e.artist} ${e.album}`.toLowerCase().includes(q)));
}

function sorted(list) {
  const l = [...list];
  if (sortMode === "year") {
    l.sort((a, b) => (b.year ?? -Infinity) - (a.year ?? -Infinity) ||
      (a.rec_date < b.rec_date ? 1 : -1));
  } else if (sortMode === "artist") {
    const key = e => e.artist.replace(/^the /i, "").toLowerCase();
    l.sort((a, b) => key(a) < key(b) ? -1 : key(a) > key(b) ? 1 : 0);
  }
  return l;   // "rec" keeps the builder's order: newest first
}

function groupKey(e) {
  if (sortMode === "rec") {
    const d = new Date(`${e.rec_date}T12:00:00`);
    return isNaN(d) ? "Undated" : d.toLocaleDateString("en-GB", { month: "long", year: "numeric" });
  }
  if (sortMode === "year") return e.year ? `${Math.floor(e.year / 10) * 10}s` : "Undated";
  return null;
}

function tile(e, i) {
  const acc = ACCENTS[e.category] || "#3F5164";
  const cover = e.cover
    ? `<img class="tile-cover" src="${esc(e.cover)}" alt="" loading="lazy">`
    : ringsSvg(acc, "tile-cover");
  return `<button class="tile" data-i="${i}" style="--acc:${acc}">
    ${cover}
    <span class="tile-body">
      <span class="klabel">${esc(e.header || CAT_LABELS[e.category] || "")}</span>
      <span class="tile-artist">${esc(e.artist)}</span>
      <span class="tile-album">${esc(e.album)}${e.year ? ` <span class="tile-year">(${esc(e.year)})</span>` : ""}</span>
      ${e.genres?.length ? `<span class="tile-genres">${esc(e.genres.join(" · "))}</span>` : ""}
    </span>
  </button>`;
}

let view = [];   // currently displayed entries, index-aligned with tiles

function render() {
  view = sorted(filtered());

  // Group-by-group, each group with its own dateline and grid.
  const parts = [];
  let current, bucket = [];
  view.forEach((e, i) => {
    const g = groupKey(e);
    if (parts.length + bucket.length && g !== current) {
      parts.push({ g: current, items: bucket });
      bucket = [];
    }
    current = g;
    bucket.push(tile(e, i));
  });
  if (bucket.length) parts.push({ g: current, items: bucket });

  $("#crate").innerHTML = parts.map(p =>
    (p.g ? `<h2 class="dateline">${esc(p.g)}</h2>` : "") +
    `<div class="grid"${p.g ? "" : ' style="margin-top:1.4rem"'}>${p.items.join("")}</div>`
  ).join("");

  $("#count").textContent = `${view.length} of ${entries.length}`;
  $("#status-line").textContent =
    `${entries.length} albums in the crate · ${entries.filter(e => e.blurb).length} with notes.`;
}

/* Controls */
$("#sorts").addEventListener("click", e => {
  const b = e.target.closest("[data-sort]");
  if (!b) return;
  sortMode = b.dataset.sort;
  document.querySelectorAll("#sorts .chip").forEach(c =>
    c.setAttribute("aria-pressed", c.dataset.sort === sortMode));
  render();
});
function renderCats() {
  $("#cats").innerHTML = `<span class="klabel">Show</span>` + Object.keys(ACCENTS).map(c => `
    <button class="chip" data-cat="${c}" aria-pressed="${catsOn.has(c)}">
      <span class="cdot" style="--dot:${ACCENTS[c]}"></span>${CAT_LABELS[c]}
    </button>`).join("");
}
$("#cats").addEventListener("click", e => {
  const b = e.target.closest("[data-cat]");
  if (!b) return;
  const c = b.dataset.cat;
  if (catsOn.has(c) && catsOn.size === 1) { Object.keys(ACCENTS).forEach(k => catsOn.add(k)); }
  else if (catsOn.has(c)) catsOn.delete(c);
  else catsOn.add(c);
  renderCats(); render();
});
$("#genre").addEventListener("change", e => { genreOn = e.target.value; render(); });
$("#q").addEventListener("input", e => { query = e.target.value; render(); });

/* Detail overlay */
function hiRes(url) {
  return url.includes("00001e02") ? url.replace("00001e02", "0000b273") : url;
}
function maybeOpenInApp(e, href) {
  const m = href.match(/open\.spotify\.com\/album\/([A-Za-z0-9]+)/);
  if (!m || !window.matchMedia("(hover: hover) and (pointer: fine)").matches) return;
  e.preventDefault();
  let answered = false;
  const settle = () => { answered = true; };
  addEventListener("blur", settle, { once: true });
  document.addEventListener("visibilitychange", settle, { once: true });
  setTimeout(() => {
    removeEventListener("blur", settle);
    document.removeEventListener("visibilitychange", settle);
    if (!answered && !document.hidden) window.open(href, "_blank", "noopener");
  }, 1200);
  location.href = `spotify:album:${m[1]}`;
}

function openDetail(i) {
  const e = view[i];
  if (!e) return;
  const acc = ACCENTS[e.category] || "#3F5164";
  const cover = e.cover
    ? `<img class="sleeve-cover" src="${esc(hiRes(e.cover))}" alt="Cover of ${esc(e.album)}"
         onerror="this.onerror=null;this.src='${esc(e.cover)}'">`
    : ringsSvg(acc, "sleeve-cover");
  const name = `<i>${esc(e.album)}</i>`;
  const link = e.spotify_url
    ? `<a href="${esc(e.spotify_url)}" target="_blank" rel="noopener">${name}</a>${e.link_is_search ? '<span class="srch">search</span>' : ""}`
    : name;
  $("#sleeve").style.setProperty("--acc", acc);
  $("#sleeve").innerHTML = `
    ${cover}
    <div>
      <span class="klabel">${esc(e.header || CAT_LABELS[e.category] || "")}</span>
      <div class="sleeve-when">recommended ${esc(prettyDate(e.rec_date))}</div>
      <div class="sleeve-artist">${esc(e.artist)}</div>
      <div class="sleeve-album">${link}${e.year ? ` <span class="sleeve-year">(${esc(e.year)})</span>` : ""}</div>
      ${e.genres?.length ? `<div class="sleeve-genres">${esc(e.genres.join(" · "))}</div>` : ""}
      ${e.blurb ? `<p>${esc(e.blurb)}</p>` : ""}
      ${e.reception ? `<p class="reception">${esc(e.reception)}</p>` : ""}
    </div>`;
  $("#detail").hidden = false;
  document.body.style.overflow = "hidden";
  $("#detail-close").focus();
}
function closeDetail() {
  $("#detail").hidden = true;
  document.body.style.overflow = "";
}
$("#crate").addEventListener("click", e => {
  const t = e.target.closest(".tile");
  if (t) openDetail(Number(t.dataset.i));
});
$("#detail").addEventListener("click", e => {
  if (e.target.closest("a")) return maybeOpenInApp(e, e.target.closest("a").href);
  if (!e.target.closest(".sleeve") || e.target.id === "detail-close") closeDetail();
  if (e.target.closest("#detail-close")) closeDetail();
});
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if (!$("#detail").hidden) closeDetail();
  else closeThemeMenu();
});

/* Load */
async function load() {
  renderCats();
  try {
    const res = await fetch(`./data/archive.json?t=${Date.now()}`, { cache: "no-store" });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    entries = data.entries || [];
    if (!entries.length) throw new Error(data.status === "pending" ? "nothing in the crate yet" : "no data");
    // Genre list from the data, first-seen casing, alphabetical.
    const seen = new Map();
    for (const e of entries) for (const g of e.genres || []) {
      const k = normGenre(g);
      if (!seen.has(k)) seen.set(k, g.trim());
    }
    [...seen.entries()].sort((a, b) => a[0] < b[0] ? -1 : 1).forEach(([k, label]) => {
      const o = document.createElement("option");
      o.value = k; o.textContent = label;
      $("#genre").appendChild(o);
    });
    render();
  } catch (err) {
    $("#status-line").textContent = `Couldn't load the crate (${err.message}).`;
  }
}
load();
</script>
